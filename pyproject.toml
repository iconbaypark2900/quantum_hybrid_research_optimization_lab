[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quantum-hybrid-research-optimization-lab"
version = "0.1.0"
description = "Verified quantum-classical optimization components: exact and heuristic Max-Cut baselines, zero-noise extrapolation checked against Mitiq, and Aer execution."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10,<3.12"

# This upper bound is not a preference. mitiq cannot be installed on 3.12+:
# every real release fails to build there, and pip falls back to a placeholder
# `mitiq 0.0.0` that installs cleanly, imports, reports a version, and has no
# `mitiq.zne` submodule. Six ZNE tests then fail in a way that reads as broken
# code rather than a broken environment.

dependencies = [
    "numpy>=1.21.0",
    "scipy>=1.10.0",
    "cvxpy>=1.3.0",

    "qiskit>=0.45.0",
    "qiskit-aer>=0.14.0",
    "qiskit-algorithms>=0.2.0",

    "mitiq>=0.16.0,!=0.0.0",

    # Transitive: Mitiq's Qiskit<->Cirq conversion imports
    # cirq.contrib.qasm_import, which needs ply. It is not pulled in
    # automatically; without it fold_global raises ModuleNotFoundError at the
    # point of use rather than at install.
    "ply>=3.11",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/iconbaypark2900/quantum_hybrid_research_optimization_lab"

[tool.setuptools.packages.find]
include = ["src*"]
namespaces = true

[tool.pytest.ini_options]
testpaths = ["tests"]
